name: Test and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Unit and Feature Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: shop_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, pcov
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application key for testing
        run: |
          if [ -f .env.testing ]; then
            cp .env.testing .env
          elif [ -f .env.testing.example ]; then
            cp .env.testing.example .env
          else
            cp .env.example .env
          fi

          if grep -q '^DB_PASSWORD=$' .env; then
            sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=root/' .env
          elif ! grep -q '^DB_PASSWORD=' .env; then
            echo 'DB_PASSWORD=root' >> .env
          fi

          php artisan key:generate --env=testing --force

      - name: Run database migrations for testing
        run: php artisan migrate --env=testing --force

      - name: Run all tests & Generate Coverage
        run: php artisan test --coverage-clover=coverage.xml --env=testing

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.GCP_PORT }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.GCP_PROJECT_PATH }}

            # 還原可能被本機修改或刪除的追蹤檔案，避免 git pull 因工作目錄不乾淨而中斷
            git restore --worktree --staged .env.testing tests/k6 || true

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            # 移除 k6 測試目錄
            if [ -d "tests/k6" ]; then
              rm -rf tests/k6
              echo "k6 test directory removed from production."
            fi

            cd ../laradock

            docker compose exec -T --user=laradock -w /var/www/shop-api workspace php artisan migrate --force
            docker compose exec -T --user=laradock -w /var/www/shop-api workspace php artisan config:cache
            docker compose exec -T --user=laradock -w /var/www/shop-api workspace php artisan route:cache
            docker compose exec -T --user=laradock -w /var/www/shop-api workspace php artisan view:cache

      - name: Health check on GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.GCP_PORT }}
          script_stop: true
          script: |
            set -e

            HEALTHCHECK_URL="${{ secrets.APP_HEALTHCHECK_URL }}"
            if [ -z "$HEALTHCHECK_URL" ]; then
              HEALTHCHECK_URL="http://127.0.0.1/api/health"
            fi

            for i in {1..10}; do
              status_code=$(curl -sS -o /tmp/healthcheck-body.txt -w "%{http_code}" --max-time 8 "$HEALTHCHECK_URL" || true)
              if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 400 ]; then
                echo "Health check passed with HTTP $status_code at $HEALTHCHECK_URL"
                exit 0
              fi

              echo "Attempt $i/10: health check failed with HTTP $status_code at $HEALTHCHECK_URL"
              if [ -s /tmp/healthcheck-body.txt ]; then
                head -c 500 /tmp/healthcheck-body.txt || true
                echo
              fi
              sleep 10
            done

            echo "Health check failed after deployment."
            exit 1
